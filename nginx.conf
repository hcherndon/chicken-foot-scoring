# Server block for the Chicken Foot web build.
#
# The image drops this into /etc/nginx/conf.d/, so it lands inside the stock
# http{} context — mime.types and the default log formats are already in scope.
# Port 8080 rather than 80 because the runtime image runs nginx as a non-root
# user, which cannot bind a privileged port.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    # The build stage wrote a .gz beside every compressible file, so nginx
    # hands those over as they are instead of re-compressing several MB of
    # engine wasm on every cold load. Serving the file untouched also leaves
    # the ETag strong, which is what the caching below depends on.
    gzip_static on;

    # Fallback for anything precompression missed.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      application/javascript text/javascript application/json
                    application/wasm text/css image/svg+xml
                    application/manifest+json font/ttf font/otf;

    # Nothing Flutter emits carries a content hash in its filename —
    # main.dart.js, canvaskit.wasm and the assets/ manifests all keep the same
    # path from one release to the next. So: no immutable caching anywhere.
    # Revalidate everything and let ETags turn an unchanged 7 MB engine into a
    # 304. Costs a round trip per asset; never serves a stale build.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # ---------------------------------------------------------------------
    # Optional: cross-origin isolation.
    #
    # Uncommenting both unlocks two faster paths — drift's OPFS-shared storage
    # backend, and Flutter's multithreaded skwasm renderer. Neither is
    # required: without these drift still persists via OPFS-locks or
    # IndexedDB, and Flutter falls back to a single-threaded renderer.
    #
    # Every asset here is same-origin so nothing should break, but COEP is
    # all-or-nothing — if a future change pulls in a cross-origin script,
    # font or image, the page stops loading. Smoke-test in a browser after
    # turning it on. Note that add_header is not additive across levels:
    # these must live in the same block as the three above.
    #
    # add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
    # ---------------------------------------------------------------------

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # WebAssembly.instantiateStreaming rejects anything that is not
    # application/wasm, and both sqlite3.wasm and the engine load that way.
    # nginx has mapped .wasm correctly since 1.21.5, so this is belt and
    # braces — it keeps the config right on an older or non-standard base.
    location ~ \.wasm$ {
        types { }
        default_type application/wasm;

        # A location with its own add_header drops every inherited one, so the
        # server-level headers have to be repeated here verbatim.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # No named routes in the app, so the URL never leaves "/". The fallback is
    # only here so a stray path or a refresh lands on the app instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
